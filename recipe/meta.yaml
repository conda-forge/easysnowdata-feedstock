{% set name = "easysnowdata" %}
{% set version = "0.3.3" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/easysnowdata-{{ version }}.tar.gz
  sha256: 1558db7f0a5860640c8d891669a583fc38cc4c0b6e062d06d3afba07f2c5fe4c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.27
    - hatch-vcs >=0.4
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    - matplotlib-scalebar
    - contextily
    - pandas
    - geopandas >=1.1
    - pyogrio >=0.12
    - pyarrow
    - pyproj
    - rasterio >=1.5
    - xarray >=2026.2
    - rioxarray >=0.22
    - shapely >=2
    - pystac >=1.12
    - pystac-client >=0.8
    - planetary-computer
    - odc-stac >=0.5
    - odc-geo >=0.5
    - earthengine-api
    - xee >=0.1
    - beautifulsoup4
    - earthaccess >=0.17
    - planet >=3.6
    - pooch
    - pyyaml
    - requests
    - lxml
    - tqdm
    - dask-core
    - zarr >=3.1
    - gcsfs
    - s3fs
    - fsspec
    - h5netcdf
    - h5py

test:
  imports:
    - easysnowdata
  # `pip check` is omitted, and it is the dependency's metadata at fault, not
  # this one's. conda-forge's `planet` installs with a dist-info version of
  # 0.0.0: planet 3.6.0 declares `dynamic = ["version"]` with setuptools_scm,
  # and planet-feedstock's host section has setuptools and pip but no
  # setuptools-scm, so the version never resolves. easysnowdata requires
  # `planet>=3.6`, so pip check reports
  #   easysnowdata 0.3.1 has requirement planet>=3.6, but you have planet 0.0.0
  # on a package that is installed correctly. Restore this line once
  # planet-feedstock adds setuptools-scm to host.
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://egagli.github.io/easysnowdata/
  summary: A Python package to easily retrieve data relevant to snow science
  license: MIT
  license_file: LICENSE
  doc_url: https://egagli.github.io/easysnowdata
  dev_url: https://github.com/egagli/easysnowdata

extra:
  recipe-maintainers:
    - egagli
